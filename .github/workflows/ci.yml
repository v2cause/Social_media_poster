name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so that the image scan finds new vulnerabilities in images whose code did not
    # change (ADR 0039), after the weekly run of the security workflow.
    - cron: '41 4 * * 1'

# Read-only by default. Jobs that need more must say so explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Playwright is pinned, but its browsers are provided by the Docker image, not downloaded here.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:deps
      - run: pnpm check:emoji
      - run: pnpm check:format
      - run: pnpm check:i18n

  commits:
    name: Commit messages
    # Every commit of a pull request: Conventional Commits format and no emoji.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The full history, so that the range between base and head is available.
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - run: pnpm check:emoji --commits "$BASE_SHA..$HEAD_SHA"

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The tests of the browser worker run the Google Chrome of the runner image.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts Postgres, Redis and friends on the runner's Docker daemon.
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The runner image ships Google Chrome, so no browser is downloaded.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env with fresh keys
        # The X browser test switches X without the API on and signs in through a stand-in of the
        # browser worker (guide steps 6.1 and 6.4); the real browser worker must not run. The billing
        # test plays Stripe with the fake on STRIPE_API_BASE, test keys only (guide step 7.5). The
        # role gdpr writes the data export of the data page (guide step 8.1).
        run: |
          grep -vE '^(BETTER_AUTH_SECRET|TOKEN_KEKS|TOKEN_KEK_ACTIVE|SESSION_KEKS|SESSION_KEK_ACTIVE|FEATURE_X_BROWSER_GLOBAL|WORKER_ROLES|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_API_BASE)=' .env.example > .env
          pnpm --silent gen:keys >> .env
          echo 'FEATURE_X_BROWSER_GLOBAL=true' >> .env
          echo 'WORKER_ROLES=scheduler,publisher,analytics,media,ai,notify,billing,gdpr' >> .env
          echo 'STRIPE_SECRET_KEY=sk_test_e2e' >> .env
          echo 'STRIPE_WEBHOOK_SECRET=whsec_e2e' >> .env
          echo 'STRIPE_API_BASE=http://127.0.0.1:12111' >> .env
      - run: docker compose up -d --wait
      - run: pnpm --filter @smp/db migrate:deploy
      - run: pnpm build
      # The demo workspace with 90 days of analytics, for the analytics test (guide step 5.5).
      - run: pnpm db:seed
      - name: Start API, worker and web
        run: |
          mkdir -p e2e-logs
          (cd apps/api && nohup node --env-file=../../.env --require @smp/observability/register dist/main.js > ../../e2e-logs/api.log 2>&1 &)
          (cd apps/worker && nohup node --env-file=../../.env --require @smp/observability/register dist/main.js > ../../e2e-logs/worker.log 2>&1 &)
          (cd apps/web && nohup ./node_modules/.bin/next start --port 3000 > ../../e2e-logs/web.log 2>&1 &)
      - name: Wait until the stack is ready
        run: |
          for url in http://127.0.0.1:3001/api/health/ready http://127.0.0.1:3002/health/ready http://localhost:3000/login; do
            timeout 120 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done
      - run: pnpm test:e2e
      - name: Service logs
        if: failure()
        run: tail -n 200 e2e-logs/*.log

  restore-drill:
    # Guide step 8.6 (ADR 0042): WAL archive, base backups and their copy to the object storage
    # work, and a restore to a point in time passes its checks. Weekly as well, so that a new
    # image of Postgres or of the AWS CLI cannot break the backups unnoticed.
    name: Restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # The seed, check:rls and restore:mark-attempts use the builds of the worker and its packages.
      - run: pnpm build --filter=@smp/worker...
      - run: pnpm backup:drill

  monitoring:
    # Guide step 8.7 (ADR 0043): the configuration of Prometheus and Alertmanager is valid and the
    # unit tests of the alert rules pass, with the images of the compose profile "observability".
    name: Monitoring rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash tools/observability/check-rules.sh

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  images:
    # Architecture 12, CI step 9 (guide step 8.4): every image builds from its Dockerfile, gets an
    # SBOM (CycloneDX) as an artifact and passes Trivy without fixable HIGH or CRITICAL
    # vulnerabilities and without secrets. The push to a registry follows with the deployment
    # (guide step 8.9).
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/node-app.Dockerfile
            app: api
          - image: worker
            dockerfile: infra/docker/node-app.Dockerfile
            app: worker
          - image: egress-proxy
            dockerfile: infra/docker/node-app.Dockerfile
            app: egress-proxy
            health-url: http://127.0.0.1:3128/health
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: browser-worker
            dockerfile: apps/browser-worker/Dockerfile
            # A lower layer of the Playwright image keeps the npm cache and log of its "npm install
            # -g yarn", with a signed URL (SAS token) of Azure storage in them; a later layer deletes
            # /root/.npm, but Trivy reads every layer.
            skip-dirs: /root/.npm
    env:
      IMAGE: smp-${{ matrix.image }}:ci
      SBOM: sbom-${{ matrix.image }}.cdx.json
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      # Trivy sends nothing home and asks for no updates.
      TRIVY_SKIP_VERSION_CHECK: 'true'
      TRIVY_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          APP: ${{ matrix.app }}
          HEALTH_URL: ${{ matrix.health-url }}
        run: |
          args=()
          if [ -n "$APP" ]; then args+=(--build-arg "APP=$APP"); fi
          if [ -n "$HEALTH_URL" ]; then args+=(--build-arg "HEALTH_URL=$HEALTH_URL"); fi
          docker build --file "$DOCKERFILE" "${args[@]}" --tag "$IMAGE" .
      - name: Install Trivy (checksum pinned)
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: SBOM
        run: ./trivy image --format cyclonedx --output "$SBOM" "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ env.SBOM }}
          if-no-files-found: error
          retention-days: 90
      - name: Scan
        # Fails on what a newer base image or package fixes; issues without a fix do not block.
        env:
          SKIP_DIRS: ${{ matrix.skip-dirs }}
        run: |
          args=()
          if [ -n "$SKIP_DIRS" ]; then args+=(--skip-dirs "$SKIP_DIRS"); fi
          ./trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress "${args[@]}" "$IMAGE"
