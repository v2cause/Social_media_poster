name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Jobs that need more must say so explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Playwright is pinned, but its browsers are provided by the Docker image, not downloaded here.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:deps
      - run: pnpm check:emoji
      - run: pnpm check:format
      - run: pnpm check:i18n

  commits:
    name: Commit messages
    # Every commit of a pull request: Conventional Commits format and no emoji.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The full history, so that the range between base and head is available.
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - run: pnpm check:emoji --commits "$BASE_SHA..$HEAD_SHA"

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The tests of the browser worker run the Google Chrome of the runner image.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts Postgres, Redis and friends on the runner's Docker daemon.
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The runner image ships Google Chrome, so no browser is downloaded.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env with fresh keys
        # The X browser test switches X without the API on and signs in through a stand-in of the
        # browser worker (guide steps 6.1 and 6.4); the real browser worker must not run.
        run: |
          grep -vE '^(BETTER_AUTH_SECRET|TOKEN_KEKS|TOKEN_KEK_ACTIVE|SESSION_KEKS|SESSION_KEK_ACTIVE|FEATURE_X_BROWSER_GLOBAL)=' .env.example > .env
          pnpm --silent gen:keys >> .env
          echo 'FEATURE_X_BROWSER_GLOBAL=true' >> .env
      - run: docker compose up -d --wait
      - run: pnpm --filter @smp/db migrate:deploy
      - run: pnpm build
      # The demo workspace with 90 days of analytics, for the analytics test (guide step 5.5).
      - run: pnpm db:seed
      - name: Start API, worker and web
        run: |
          mkdir -p e2e-logs
          (cd apps/api && nohup node --env-file=../../.env --require @smp/observability/register dist/main.js > ../../e2e-logs/api.log 2>&1 &)
          (cd apps/worker && nohup node --env-file=../../.env --require @smp/observability/register dist/main.js > ../../e2e-logs/worker.log 2>&1 &)
          (cd apps/web && nohup ./node_modules/.bin/next start --port 3000 > ../../e2e-logs/web.log 2>&1 &)
      - name: Wait until the stack is ready
        run: |
          for url in http://127.0.0.1:3001/api/health/ready http://127.0.0.1:3002/health/ready http://localhost:3000/login; do
            timeout 120 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done
      - run: pnpm test:e2e
      - name: Service logs
        if: failure()
        run: tail -n 200 e2e-logs/*.log

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
