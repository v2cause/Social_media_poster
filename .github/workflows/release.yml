name: Release

# Guide step 8.9 (ADR 0045): a tag v* builds the images of the production template, scans them
# as the CI does, pushes them to the GitHub Container Registry, signs them without a key of our own
# (cosign with the OIDC identity of this workflow, Sigstore) and attests their SBOM (CycloneDX).
# deploy/scripts/deploy.sh checks signature and attestation before the start.
on:
  push:
    tags: ['v*']

# Read-only by default. Jobs that need more must say so explicitly.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Release (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # The push to ghcr.io/v2cause/social_media_poster.
      packages: write
      # The OIDC token of the run, which Sigstore turns into the certificate of the signature.
      id-token: write
    strategy:
      # deploy.sh refuses a release with an image that has no signature, so a failed image stops it.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/node-app.Dockerfile
            app: api
          - image: worker
            dockerfile: infra/docker/node-app.Dockerfile
            app: worker
            health-url: http://127.0.0.1:3002/health/live
          - image: egress-proxy
            dockerfile: infra/docker/node-app.Dockerfile
            app: egress-proxy
            health-url: http://127.0.0.1:3128/health
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: migrate
            dockerfile: infra/docker/migrate.Dockerfile
          - image: browser-worker
            dockerfile: apps/browser-worker/Dockerfile
            # See the job "images" of ci.yml.
            skip-dirs: /root/.npm
    env:
      REGISTRY: ghcr.io/v2cause/social_media_poster
      SBOM: sbom-${{ matrix.image }}.cdx.json
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRIVY_SKIP_VERSION_CHECK: 'true'
      TRIVY_DISABLE_TELEMETRY: 'true'
      COSIGN_VERSION: 3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      # The identity deploy.sh expects: this workflow, run for a tag v*.
      SIGNER: ^https://github\.com/v2cause/Social_media_poster/\.github/workflows/release\.yml@refs/tags/v
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Name of the image
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          # The tag of the image is the tag of the release, as deploy/.env names it in SMP_VERSION.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "release: $TAG is not a version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "IMAGE=$REGISTRY/$IMAGE_NAME:$TAG" >> "$GITHUB_ENV"
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          APP: ${{ matrix.app }}
          HEALTH_URL: ${{ matrix.health-url }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          args=()
          if [ -n "$APP" ]; then args+=(--build-arg "APP=$APP"); fi
          if [ -n "$HEALTH_URL" ]; then args+=(--build-arg "HEALTH_URL=$HEALTH_URL"); fi
          # The source label links the package in the registry to this repository.
          docker build --file "$DOCKERFILE" "${args[@]}" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$IMAGE" .
      - name: Install Trivy and cosign (checksums pinned)
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          curl -sSfL -o cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
      - name: SBOM
        run: ./trivy image --format cyclonedx --output "$SBOM" "$IMAGE"
      - name: Scan
        # The gate of the CI: no fixable HIGH or CRITICAL vulnerability, no secret.
        env:
          SKIP_DIRS: ${{ matrix.skip-dirs }}
        run: |
          args=()
          if [ -n "$SKIP_DIRS" ]; then args+=(--skip-dirs "$SKIP_DIRS"); fi
          ./trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 --no-progress "${args[@]}" "$IMAGE"
      - name: Push
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE"
          # Signature and attestation name the digest, never the tag, which could move.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          docker logout ghcr.io
      - name: Sign and attest the SBOM
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          ./cosign sign --yes "$DIGEST"
          ./cosign attest --yes --type cyclonedx --predicate "$SBOM" "$DIGEST"
          # The checks of deploy.sh, against what was just written.
          ./cosign verify --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            "$DIGEST" > /dev/null
          ./cosign verify-attestation --type cyclonedx --certificate-identity-regexp "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" "$DIGEST" > /dev/null
          docker logout ghcr.io
          echo "release: $DIGEST signed, SBOM attested"
