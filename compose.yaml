# Local infrastructure for development and tests.
#
# Every image is pinned to an exact version. Never switch to "latest".
# All ports are bound to 127.0.0.1. Copy .env.example to .env before the first start.
#
# Profiles:
#   (default)      postgres, redis, s3 (+ bucket init), mailpit
#   app            api, worker and web, built from their Dockerfiles, behind the proxy on
#                  http://localhost:8080 (routes /api to the API like production)
#   xb             browser-worker (isolated Playwright host, consumes xb-commands only) in the
#                  internal network "xb", which reaches Redis and the egress proxy only; the
#                  egress proxy lets it out to the X web app and the storage, nowhere else
#   observability  grafana/otel-lgtm (Grafana on host port 3003, OTLP on 4317/4318)
#   clamav         optional virus scan on 127.0.0.1:3310
#

name: social-media-poster

# Runtime hardening for the app containers: no privilege escalation, no Linux capabilities, a
# read-only root filesystem with a small writable /tmp. The images run as non-root users anyway.
x-hardened: &hardened
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp']

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # The image trusts loopback connections by default. Require the password everywhere,
      # so that app_user is always checked, also from inside the container.
      POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
      APP_SYSTEM_PASSWORD: ${APP_SYSTEM_PASSWORD:?set APP_SYSTEM_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    # The init scripts run only when the data volume is empty. After changing them, run
    # `docker compose down -v` once to recreate the volume.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # BullMQ needs noeviction, otherwise Redis may delete job data under memory pressure. Nobody
    # works without a password (ADR 0039): the default user is off, API and worker sign in as
    # "app", the healthcheck as "health", which may only PING, and the user "browser-worker" reaches
    # only the keys and queues of the X browser (XB_REDIS_ACL in packages/x-browser). The tests of
    # the browser worker start Redis with these users.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --user
      - default
      - 'off'
      - --user
      - app
      - 'on'
      - '>${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD in .env}'
      - '~*'
      - '&*'
      - '+@all'
      - --user
      - health
      - 'on'
      - nopass
      - '+ping'
      - --user
      - browser-worker
      - 'on'
      - '>${XB_REDIS_PASSWORD:?set XB_REDIS_PASSWORD in .env}'
      - resetkeys
      - '%R~xb:kill'
      - '~xb:lock:*'
      - '~xb:spacing:*'
      - '~xb:login:*'
      - '~bull:xb-commands:*'
      - '~bull:xb-results:*'
      - resetchannels
      - '+@all'
      - '-@dangerous'
      - '+info'
    # Also in the internal network of the browser worker.
    networks: [default, xb]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--user', 'health', '--pass', 'unused', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # -ip pins the master identity to the service name. Without it, a recreated container gets a
    # new address, and the raft state in the volume no longer matches it.
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data', '-ip=s3']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - ./infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      # Checks the S3 port itself. The master status alone reported healthy while uploads failed.
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', 'http://127.0.0.1:8333/']
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      s3:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-smp-media}
    command:
      - |
        set -eu
        endpoint=http://s3:8333
        aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 \
          || aws --endpoint-url "$$endpoint" s3 mb "s3://$$S3_BUCKET"
        aws --endpoint-url "$$endpoint" s3api put-bucket-cors --bucket "$$S3_BUCKET" \
          --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000","http://localhost:8080"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["Content-Type"],"MaxAgeSeconds":3000}]}'
        echo "s3-init: bucket $$S3_BUCKET is ready"

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
      args:
        APP: api
        HEALTH_URL: http://127.0.0.1:3001/api/health/live
    profiles: ['app']
    restart: unless-stopped
    <<: *hardened
    env_file: .env
    # Inside the compose network the services are reached by their service names.
    environment:
      NODE_ENV: production
      # The browser reaches the app through the proxy, not on the dev port 3000.
      APP_URL: http://localhost:8080
      BETTER_AUTH_URL: http://localhost:8080
      API_PORT: '3001'
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}@postgres:5432/smp
      DATABASE_SYSTEM_URL: postgresql://app_system:${APP_SYSTEM_PASSWORD:?set APP_SYSTEM_PASSWORD in .env}@postgres:5432/smp
      REDIS_URL: redis://app:${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD in .env}@redis:6379
      S3_ENDPOINT: http://s3:8333
      # Upload and preview URLs are signed for the address the browser reaches.
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
      # Production checks new passwords against known breaches.
      PWNED_PASSWORDS_API_URL: ${PWNED_PASSWORDS_API_URL:-https://api.pwnedpasswords.com}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      # The API needs the bucket. As a completed dependency, the one-shot init container also
      # no longer fails `docker compose up --wait` when it exits.
      s3-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
      args:
        APP: worker
        HEALTH_URL: http://127.0.0.1:3002/health/live
    profiles: ['app']
    restart: unless-stopped
    <<: *hardened
    env_file: .env
    # SIGTERM lets the running job finish. Docker's default of 10 s is shorter than a typical
    # publish; whatever is cut off after this is picked up by lease and reconcile.
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: '3002'
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}@postgres:5432/smp
      # The role "scheduler" scans across workspaces (ticks, outbox relay) as app_system.
      DATABASE_SYSTEM_URL: postgresql://app_system:${APP_SYSTEM_PASSWORD:?set APP_SYSTEM_PASSWORD in .env}@postgres:5432/smp
      REDIS_URL: redis://app:${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD in .env}@redis:6379
      SMTP_URL: smtp://mailpit:1025
      # The role "media" reads uploads and writes renditions. The role "publisher" signs the URLs
      # of renditions for the platforms with S3_PUBLIC_ENDPOINT, which they must be able to reach.
      S3_ENDPOINT: http://s3:8333
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    profiles: ['app']
    restart: unless-stopped
    <<: *hardened
    # Next.js writes its runtime cache (images, rendered data) below .next/cache.
    tmpfs: ['/tmp', '/app/apps/web/.next/cache']
    environment:
      # Server-side calls from Next.js to the API inside the compose network. The browser goes
      # through the proxy.
      API_INTERNAL_URL: http://api:3001
      # The storage address the browser uploads to and loads thumbnails from (Content Security
      # Policy); the same as the API signs its URLs for.
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2.11.4-alpine
    profiles: ['app']
    restart: unless-stopped
    <<: *hardened
    # The caddy binary carries the bind capability as a file capability; without it in the bounding
    # set the kernel refuses to start it. Caddy keeps its state in /data and /config.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ['/tmp', '/data', '/config']
    volumes:
      - ./infra/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    profiles: ['xb']
    restart: unless-stopped
    <<: *hardened
    # Chromium needs shared memory, and init reaps its child processes.
    init: true
    shm_size: 1gb
    # Only the internal network: Redis and the egress proxy, no database, no API, no internet.
    networks: [xb]
    depends_on:
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    # No env_file: the container gets only what it needs, never database or storage credentials.
    environment:
      REDIS_URL: redis://browser-worker:${XB_REDIS_PASSWORD:?set XB_REDIS_PASSWORD in .env}@redis:6379
      NODE_ENV: production
      LOG_LEVEL: info
      FEATURE_X_BROWSER_GLOBAL: 'true'
      # Only this container opens the sessions of X.
      SESSION_KEKS: ${SESSION_KEKS:-}
      SESSION_KEK_ACTIVE: ${SESSION_KEK_ACTIVE:-}
      # The media are signed for S3_PUBLIC_ENDPOINT; inside the network the storage is s3:8333.
      XB_EGRESS_HOSTS: http://s3:8333
      # Chromium and the media downloads of Node leave through the egress proxy.
      XB_EGRESS_PROXY: http://egress-proxy:3128
      NODE_USE_ENV_PROXY: '1'
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: redis
      # Chromium keeps its profile below HOME; the root filesystem is read-only.
      HOME: /tmp

  egress-proxy:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
      args:
        APP: egress-proxy
        HEALTH_URL: http://127.0.0.1:3128/health
    profiles: ['xb']
    restart: unless-stopped
    <<: *hardened
    # Between the internal network of the browser worker and the outside.
    networks: [default, xb]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      EGRESS_PORT: '3128'
      # The hosts of X come with the selector map; on top the storage of the media.
      XB_EGRESS_HOSTS: http://s3:8333

  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ['observability']
    restart: unless-stopped
    ports:
      # Not 3001: the API listens there, both in pnpm dev and in the app profile.
      - '127.0.0.1:3003:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    profiles: ['clamav']
    restart: unless-stopped
    ports:
      - '127.0.0.1:3310:3310'

networks:
  default: {}
  # No route out: the browser worker reaches Redis and the egress proxy only.
  xb:
    internal: true

volumes:
  postgres-data:
  redis-data:
  s3-data:
