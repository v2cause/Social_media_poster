# The X API (guide step 4.14, ADR 0046) for the production template: with PLATFORM_MODE_X=live,
# scripts/deploy.sh adds this file. The app is a confidential client ("Web App"), its secret lies
# in deploy/secrets/x_client_secret (docs/runbooks/deployment.md).

x-x-api: &x-api
  environment:
    X_CLIENT_ID: ${X_CLIENT_ID:?set X_CLIENT_ID in deploy/.env}
    X_CLIENT_SECRET_FILE: /run/secrets/x_client_secret
  secrets: [x_client_secret]

services:
  api-1: *x-api
  api-2: *x-api
  worker-publisher: *x-api
  worker-billing: *x-api

secrets:
  x_client_secret:
    file: secrets/x_client_secret
