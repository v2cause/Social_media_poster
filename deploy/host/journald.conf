# The logs of the production template (guide step 8.9, ADR 0045). Docker hands the output of
# every container to journald (SMP_LOG_DRIVER=journald); journald keeps it 30 days on disk and
# deletes older entries. Only root and the members of the group systemd-journal read it.
# Install: cp deploy/host/journald.conf /etc/systemd/journald.conf.d/smp.conf
#          systemctl restart systemd-journald
[Journal]
Storage=persistent
MaxRetentionSec=30day
Compress=yes
# A limit of the disk space beside the 30 days, so that a flood of logs cannot fill the disk.
SystemMaxUse=8G
