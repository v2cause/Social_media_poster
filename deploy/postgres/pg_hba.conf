# The clients of Postgres in the production template (guide step 8.9, ADR 0045): over the network
# only with TLS and a password (SCRAM), never without TLS. The socket inside the container serves
# the initialisation and the healthcheck of the image, again with the password.
#
# TYPE      DATABASE     USER        ADDRESS        METHOD
local       all          postgres                   scram-sha-256
# Base backups of the sidecar "postgres-backup", which shares the network of this container.
hostssl     replication  svc_backup  127.0.0.1/32   scram-sha-256
hostssl     all          all         0.0.0.0/0      scram-sha-256
hostssl     all          all         ::/0           scram-sha-256
hostnossl   all          all         0.0.0.0/0      reject
hostnossl   all          all         ::/0           reject
