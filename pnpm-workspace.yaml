packages:
  - 'apps/*'
  - 'packages/*'

# Supply chain. Versions younger than one day are not installed: most malicious releases are
# found and pulled within hours. A package whose publishing trust drops (for example from a
# trusted publisher to no provenance) fails the install, transitive dependencies may only come
# from the registry, and every dependency with an install script must be reviewed below.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Reviewed exceptions, each for one exact version. prisma 7.5.0 to 7.9.1 were published through
# GitHub Actions with provenance, 7.10.0 by the prismabot account without it. It matches the
# signed GitHub release 7.10.0 of prisma/prisma (2026-08-25), so it is accepted. Any later version
# without provenance fails again and needs its own review.
# semver 6.3.1 is the backport of the ReDoS fix (CVE-2022-25883) to the 6.x line, published on
# 2023-07-10 by the npm CLI maintainer lukekarrys (gitHead b717044). It came after 7.5.2 to 7.5.4,
# which had provenance, so the check reads it as a downgrade. @babel/core still needs semver 6.
trustPolicyExclude:
  - 'prisma@7.10.0'
  - 'semver@6.3.1'
blockExoticSubdeps: true
strictDepBuilds: true

# Security fixes for transitive dependencies, each within the same major version.
#   mysql2: GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3 (pulled in by the prisma CLI; MySQL is unused)
#   js-yaml 5: GHSA-r3ph-w7gj-g6xm (via @nestjs/swagger)
overrides:
  'mysql2@3': '^3.23.1'
  'js-yaml@5': '^5.4.1'

# Advisories accepted after review. CI fails on every other high or critical finding.
#   GHSA-ggr8-5vv4-36mx (deepmerge-ts): only the prisma CLI uses it, to merge our own config file.
#     The fix is a new major the CLI does not support yet. Revisit with the next prisma update.
#   GHSA-vfj7-8cjw-p6xm (braces): only lint tooling uses it, and no fixed version exists.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
    - GHSA-vfj7-8cjw-p6xm

# Reviewed install scripts. Allowed: native binaries and engines the build needs.
# Skipped: transitive scripts from testcontainers and the spike tooling. ssh2 and cpu-features
# only add optional native speed-ups, protobufjs needs no build at install time, @parcel/watcher
# serves Orval's watch mode only, @scarf/scarf is telemetry, msgpackr-extract is an optional
# native speed-up. core-js 2 (via twitter-text) only prints a funding message after install.
allowBuilds:
  sharp: true
  prisma: true
  '@prisma/engines': true
  esbuild: true
  '@swc/core': true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  msgpackr-extract: false
  core-js: false
